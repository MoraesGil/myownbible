# live demo — 100% Cloudflare free tier: Workers Assets estáticos, sem banco.
# (assets estáticos são gratuitos e não contam requests; /api/* roda no Worker)
name = "myownbible-demo"
main = "worker.js"
compatibility_date = "2026-08-01"
workers_dev = false

[assets]
directory = "dist"
binding = "ASSETS"

# o custom domain bible.moraesdev.io está anexado via API de conta
# (PUT /accounts/{acc}/workers/domains) — não precisa de rota aqui, e assim
# o deploy funciona com token sem permissões de zona.
